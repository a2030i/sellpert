name: Coordinated reliability release
on:
  push:
    branches: [fix/operational-reliability]
    paths: [scripts/releases/coordinated-20261127/dispatch.json]
permissions:
  contents: read
concurrency:
  group: supabase-production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'a2030i/sellpert'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.111.0
      - run: node --test scripts/coordinated-release.test.mjs
      - name: Execute the immutable reviewed operation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/coordinated-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordinated-release-receipt
          path: coordinated-release-receipt.json
          if-no-files-found: ignore
          retention-days: 30
