name: Production smoke monitor

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'scripts/test-production-smoke.ps1'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify production availability and authorization boundaries
        shell: pwsh
        run: ./scripts/test-production-smoke.ps1 -ExpectedRelease '${{ github.sha }}'
