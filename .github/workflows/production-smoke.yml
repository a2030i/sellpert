name: Production smoke monitor

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Verify production availability and authorization boundaries
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            ./scripts/test-production-smoke.ps1 -ExpectedRelease '${{ github.sha }}' -ReleaseWaitSeconds 240
          } else {
            ./scripts/test-production-smoke.ps1
          }
