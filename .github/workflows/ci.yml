name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Tests must never depend on a developer's local .env or production secrets.
      VITE_SUPABASE_URL: https://test-project.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-public-anon-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium
      - name: Browser journey checks
        run: npm run test:e2e
