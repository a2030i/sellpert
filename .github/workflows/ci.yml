name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Tests must never depend on a developer's local .env or production secrets.
      VITE_SUPABASE_URL: https://test-project.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-public-anon-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium
      - name: Browser journey checks
        run: npm run test:e2e

  database-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Start isolated Supabase stack and apply migrations
        run: supabase start
      - name: Run tenant isolation and authorization tests
        run: bash scripts/run-database-tests.sh

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every Supabase Edge Function
        run: deno check supabase/functions/*/index.ts
      - name: Test shared Edge Function security utilities
        run: deno test supabase/functions/_shared/*.test.ts
