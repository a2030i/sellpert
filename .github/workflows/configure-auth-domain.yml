name: Configure Sellpert Auth domain

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect safely, or apply the reviewed app.sellpert.com configuration
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - apply

permissions:
  contents: read

# Share the backend release lock; do not overlap with a Supabase deployment.
concurrency:
  group: supabase-production-release
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test configuration merge and sanitized failures
        run: node --test scripts/configure-auth-domain.test.mjs
      - name: Inspect or apply the fixed production domain configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CONFIGURATION_MODE: ${{ inputs.mode }}
        run: node scripts/configure-auth-domain.mjs "--${CONFIGURATION_MODE}"
