name: Platform access verification

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify access or send the owner-authorized Vercel invitation to Rakan
        type: choice
        options: [verify, invite-rakan]
        default: verify
        required: true

permissions:
  contents: read

concurrency:
  group: platform-access
  cancel-in-progress: false

jobs:
  vercel:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify Vercel access
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/platform-access.mjs vercel-verify
      - name: Invite or promote only Rakan to team Owner
        if: inputs.operation == 'invite-rakan'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/platform-access.mjs vercel-invite-rakan
  supabase:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify Supabase organization membership without exposing member records
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/platform-access.mjs supabase-verify
