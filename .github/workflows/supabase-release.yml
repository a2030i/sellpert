name: Supabase production release

on:
  push:
    branches: [main, master]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'scripts/deploy-supabase-release.ps1'
      - 'scripts/Test-SupabaseMigrationParity.ps1'
      - '.github/workflows/supabase-release.yml'
      - 'scripts/wait-for-release-ci.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: supabase-production-release
  cancel-in-progress: false

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Require successful CI for this immutable production commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-release-ci.mjs

  deploy:
    needs: verify-ci
    # This marker is used only after the coordinated workflow has applied SQL,
    # deployed its exact handlers, and passed the unchanged parity guard.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[coordinated-backend-ready]')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}
      - uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.111.0
      - name: Validate required Supabase secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN' >&2; missing=1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD' >&2; missing=1; }
          exit "$missing"
      - name: Deploy functions, migrations, then final functions
        shell: pwsh
        run: ./scripts/deploy-supabase-release.ps1
