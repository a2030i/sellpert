name: Supabase production release

on:
  push:
    branches: [main, master]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'scripts/deploy-supabase-release.ps1'
      - 'scripts/Test-SupabaseMigrationParity.ps1'
      - '.github/workflows/supabase-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check production deploy configuration
        id: deploy_config
        shell: bash
        run: |
          if [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_DB_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo '### Supabase deployment is configured' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            {
              echo '### Supabase deployment was not started'
              echo
              echo 'The production environment is missing one or more required GitHub secrets:'
              echo '- `SUPABASE_ACCESS_TOKEN`'
              echo '- `SUPABASE_DB_PASSWORD`'
              echo
              echo 'Database validation continues in CI and the schema recovery workflow. Add both secrets to enable automatic production deployment.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v5
        if: steps.deploy_config.outputs.ready == 'true'
      - uses: supabase/setup-cli@v3.0.0
        if: steps.deploy_config.outputs.ready == 'true'
        with:
          version: 2.111.0
      - name: Deploy functions, migrations, then final functions
        if: steps.deploy_config.outputs.ready == 'true'
        shell: pwsh
        run: ./scripts/deploy-supabase-release.ps1
