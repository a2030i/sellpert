name: Configure Sellpert Auth domain

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect safely, or apply the reviewed app.sellpert.com configuration
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - apply
          - inspect_database

permissions:
  contents: read

# Share the backend release lock; do not overlap with a Supabase deployment.
concurrency:
  group: supabase-production-release
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/ops/amazon-domain-20261126'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test configuration merge and sanitized failures
        run: node --test scripts/configure-auth-domain.test.mjs scripts/inspect-release-database.test.mjs
      - name: Inspect or apply the fixed production domain configuration
        if: inputs.mode != 'inspect_database'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CONFIGURATION_MODE: ${{ inputs.mode }}
        run: node scripts/configure-auth-domain.mjs "--${CONFIGURATION_MODE}"
      - uses: supabase/setup-cli@v3.0.0
        if: inputs.mode == 'inspect_database'
        with:
          version: 2.111.0
      - name: Verify deployment database access without applying migrations
        if: inputs.mode == 'inspect_database'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/inspect-release-database.mjs
