name: Read-only production recovery inspection

on:
  push:
    branches: [fix/operational-reliability]
    paths:
      - scripts/inspect-production-recovery.mjs
      - scripts/inspect-production-recovery.test.mjs
      - .github/workflows/inspect-production-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'a2030i/sellpert'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test scripts/inspect-production-recovery.test.mjs
      - name: Inspect backup and migration metadata without production writes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/inspect-production-recovery.mjs
      - name: Run unchanged parity guard on the captured production versions
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path production-migration-list.txt)) { throw 'No verified history metadata available.' }
          ./scripts/Test-SupabaseMigrationParity.ps1 -MigrationListOutput (Get-Content production-migration-list.txt -Raw)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-recovery-inspection
          path: |
            production-recovery-inspection.json
            production-migration-list.txt
          if-no-files-found: ignore
          retention-days: 7
